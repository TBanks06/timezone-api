# Render Blueprint — deploy the whole service with one click.
# Docs: https://render.com/docs/infrastructure-as-code
services:
  - type: web
    name: nigeria-timezone-api
    env: docker
    plan: starter            # free tier works; upgrade for traffic
    region: frankfurt        # close to Nigeria -> low latency
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: CORS_ORIGINS
        value: "*"
      - key: RATE_LIMIT_PER_MINUTE
        value: "120"
